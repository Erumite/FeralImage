name: Build and Release Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unit Tests
        run: node test_logic.js

      - name: Create Zip Package
        run: |
          zip -r feral-images-extension.zip manifest.json background.js content.js styles.css icons README.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feral-images-extension
          path: feral-images-extension.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: feral-images-extension

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: feral-images-extension.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
